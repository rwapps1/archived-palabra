<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palabra — Spanish Vocab Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --bg: #A6091C;
    --bg-card: #8C0817;
    --bg-card-alt: #7A0713;
    --ochre: #FFC400;
    --terracotta: #FF6B57;
    --cream: #FFF6E0;
    --cream-dim: #F0BFC0;
    --green: #4C9A5B;
    --red: #FF6B57;
    --outline: #5C0E14;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
  }
  .upload-screen { justify-content: center; }

  .wrap { width: 100%; max-width: 420px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--ochre);
    text-transform: uppercase;
    text-align: center;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 42px;
    margin: 8px 0;
    line-height: 1.05;
    text-align: center;
  }
  .sub {
    color: var(--cream-dim);
    font-size: 15px;
    line-height: 1.5;
    text-align: center;
    margin: 0 0 28px;
  }

  .card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--outline);
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--outline);
    border-top-color: var(--ochre);
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dropzone {
    display: block;
    text-align: center;
    padding: 28px 16px;
    border: 2px dashed var(--outline);
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .dropzone .icon { font-size: 28px; margin-bottom: 6px; }
  .dropzone .name { font-weight: 600; }
  .dropzone .hint { font-size: 13px; color: var(--cream-dim); margin-top: 4px; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--cream-dim);
    margin-bottom: 16px;
  }

  .msg-error {
    background: rgba(181,72,61,0.18);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  .msg-ok {
    font-size: 14px;
    color: var(--ochre);
    margin-bottom: 16px;
  }

  .link-btn {
    background: none;
    border: none;
    color: var(--cream-dim);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-bottom: 16px;
    display: inline-block;
  }

  button {
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn-primary {
    width: 100%;
    padding: 14px 0;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 16px;
    background: var(--ochre);
    color: var(--bg);
  }
  .btn-primary:disabled {
    cursor: not-allowed;
    background: var(--outline);
    color: var(--cream-dim);
  }
  .btn-secondary {
    flex: 1;
    padding: 14px 0;
    border-radius: 10px;
    border: 1px solid var(--outline);
    font-weight: 600;
    font-size: 15px;
    background: transparent;
    color: var(--cream);
  }

  .footnote {
    text-align: center;
    font-size: 12px;
    color: var(--cream-dim);
    margin-top: 16px;
    line-height: 1.5;
  }

  .tiles {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 4px;
    margin-bottom: 32px;
  }
  .tile { height: 8px; border-radius: 2px; background: var(--outline); }

  .progress-label {
    text-align: center;
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--ochre);
  }

  .prompt-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
    border: 1px solid var(--outline);
    margin-bottom: 20px;
  }
  .prompt-word {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--outline);
    background: var(--bg-card-alt);
    color: var(--cream);
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
    font-family: 'Inter', sans-serif;
  }

  .feedback {
    padding: 16px 18px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .feedback.correct {
    background: rgba(91,140,90,0.18);
    border: 1px solid var(--green);
  }
  .feedback.wrong {
    background: rgba(181,72,61,0.18);
    border: 1px solid var(--red);
  }
  .feedback .title { font-weight: 600; }
  .feedback .answer { font-size: 14px; color: var(--cream-dim); margin-top: 4px; }
  .feedback .answer strong { color: var(--cream); }

  .score-big {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    text-align: center;
  }

  .mosaic {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    margin-bottom: 28px;
  }
  .mosaic .sq { aspect-ratio: 1; border-radius: 4px; }

  .review-title { font-weight: 600; margin-bottom: 12px; }
  .review-item {
    font-size: 14px;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--outline);
  }
  .review-item:last-child { border-bottom: none; margin-bottom: 0; }
  .review-item .from { color: var(--cream-dim); }
  .review-item .to { color: var(--cream); font-weight: 600; }
  .review-item .yours { color: var(--terracotta); font-size: 13px; margin-top: 2px; }

  .btn-row { display: flex; gap: 10px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // ── Edit this to match the file name sitting in your repo ──
  const WORDS_FILE = 'words.xlsx';
  // ─────────────────────────────────────────────────────────

  const COLORS = {
    green: '#4C9A5B',
    red: '#FF6B57',
    ochre: '#FFC400',
  };

  const state = {
    screen: 'start', // start | quiz | result
    loading: true,
    fetchFailed: false,
    showUpload: false,
    pairs: [],
    error: '',
    hasHeader: true,
    fileName: '',
    rawRows: null,
    questions: [],
    index: 0,
    input: '',
    checked: false,
    wasCorrect: false,
    results: [],
  };

  function normalize(str) {
    return str.toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function splitAnswers(cell) {
    return cell.toString().split(/[/;,]/).map(s => s.trim()).filter(Boolean);
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function parseRows(rows, skipHeader) {
    const startIdx = skipHeader ? 1 : 0;
    const cleaned = [];
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      const es = (row[0] ?? '').toString().trim();
      const en = (row[1] ?? '').toString().trim();
      if (es && en) cleaned.push({ es, en });
    }
    if (cleaned.length === 0) {
      state.error = 'No word pairs found. Make sure column A has Spanish and column B has English.';
      state.pairs = [];
    } else {
      state.error = '';
      state.pairs = cleaned;
    }
    render();
  }

  // Auto-load the word list from the repo on page load
  async function loadFromRepo() {
    state.loading = true;
    state.fetchFailed = false;
    render();
    try {
      const resp = await fetch(WORDS_FILE);
      if (!resp.ok) throw new Error('File not found: ' + resp.status);
      const buf = await resp.arrayBuffer();
      const data = new Uint8Array(buf);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      state.rawRows = rows;
      state.fileName = WORDS_FILE;
      state.loading = false;
      parseRows(rows, state.hasHeader);
    } catch (err) {
      state.loading = false;
      state.fetchFailed = true;
      state.showUpload = true;
      state.error = "Couldn't load \"" + WORDS_FILE + "\" automatically. If you're opening this file directly on your computer rather than through GitHub Pages or a local server, browsers block that kind of file access — try uploading it manually below, or view the page via its GitHub Pages URL instead.";
      render();
    }
  }

  function handleFile(file) {
    if (!file) return;
    state.error = '';
    state.fileName = file.name;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        state.rawRows = rows;
        parseRows(rows, state.hasHeader);
      } catch (err) {
        state.error = "Couldn't read that file. Make sure it's a valid .xlsx or .xls file.";
        state.pairs = [];
        render();
      }
    };
    reader.onerror = () => { state.error = "Couldn't read that file."; render(); };
    reader.readAsArrayBuffer(file);
  }

  function toggleHeader() {
    state.hasHeader = !state.hasHeader;
    if (state.rawRows) parseRows(state.rawRows, state.hasHeader);
    else render();
  }

  function startQuiz() {
    const count = 20;
    let base;
    if (state.pairs.length >= count) {
      base = shuffle(state.pairs).slice(0, count);
    } else if (state.pairs.length > 0) {
      base = [];
      while (base.length < count) base = base.concat(shuffle(state.pairs));
      base = base.slice(0, count);
    } else {
      base = [];
    }
    state.questions = base.map(p => ({ ...p, direction: Math.random() < 0.5 ? 'es-en' : 'en-es' }));
    state.index = 0;
    state.results = [];
    state.input = '';
    state.checked = false;
    state.screen = 'quiz';
    render();
  }

  function submitAnswer() {
    const current = state.questions[state.index];
    if (!current || state.checked) return;
    const targetField = current.direction === 'es-en' ? current.en : current.es;
    const acceptable = splitAnswers(targetField).map(normalize);
    const userNorm = normalize(state.input);
    const correct = userNorm.length > 0 && acceptable.includes(userNorm);
    state.wasCorrect = correct;
    state.checked = true;
    state.results.push({
      prompt: current.direction === 'es-en' ? current.es : current.en,
      correctAnswer: targetField,
      userAnswer: state.input,
      correct,
    });
    render();
  }

  function nextQuestion() {
    if (state.index + 1 >= state.questions.length) {
      state.screen = 'result';
    } else {
      state.index += 1;
      state.input = '';
      state.checked = false;
    }
    render();
  }

  function playAgainFromScratch() {
    // Re-fetch from repo in case the file was updated since page load
    state.screen = 'start';
    loadFromRepo();
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderStart() {
    const app = document.getElementById('app');

    let statusHtml = '';
    if (state.loading) {
      statusHtml = `<div class="status-line"><div class="spinner"></div> Loading word list from ${esc(WORDS_FILE)}…</div>`;
    } else if (state.error) {
      statusHtml = `<div class="msg-error">${esc(state.error)}</div>`;
    } else if (state.pairs.length > 0) {
      statusHtml = `<div class="msg-ok">✓ ${state.pairs.length} word${state.pairs.length === 1 ? '' : 's'} loaded from ${esc(state.fileName)}</div>`;
    }

    let uploadHtml = '';
    if (!state.loading && state.showUpload) {
      uploadHtml = `
        <label class="dropzone" for="file-upload">
          <div class="icon">📄</div>
          <div class="name">Choose Excel file</div>
          <div class="hint">Column A: Spanish · Column B: English</div>
        </label>
        <input id="file-upload" type="file" accept=".xlsx,.xls" style="display:none" />
      `;
    }

    let toggleLinkHtml = '';
    if (!state.loading && !state.showUpload) {
      toggleLinkHtml = `<button id="show-upload-btn" class="link-btn">Use a different word list instead</button><br/>`;
    }

    app.innerHTML = `
      <div class="screen upload-screen">
        <div class="wrap">
          <div class="eyebrow">Vocabulario</div>
          <h1>Palabra</h1>
          <p class="sub">20 words, quizzed in both directions, straight from your word list.</p>
          <div class="card">
            ${statusHtml}
            ${uploadHtml}
            ${!state.loading ? `<label class="checkbox-row"><input id="header-toggle" type="checkbox" ${state.hasHeader ? 'checked' : ''} /> First row is a header (skip it)</label>` : ''}
            ${toggleLinkHtml}
            <button id="start-btn" class="btn-primary" ${state.pairs.length === 0 ? 'disabled' : ''}>Start quiz — 20 words</button>
          </div>
        </div>
      </div>
    `;

    if (!state.loading) {
      document.getElementById('header-toggle').addEventListener('change', toggleHeader);
      document.getElementById('start-btn').addEventListener('click', startQuiz);
      if (state.showUpload) {
        document.getElementById('file-upload').addEventListener('change', (e) => handleFile(e.target.files[0]));
      } else {
        document.getElementById('show-upload-btn').addEventListener('click', () => { state.showUpload = true; render(); });
      }
    }
  }

  function renderQuiz() {
    const app = document.getElementById('app');
    const current = state.questions[state.index];
    if (!current) return;

    let tilesHtml = '';
    state.questions.forEach((_, i) => {
      let bg = 'var(--outline)';
      if (i < state.results.length) bg = state.results[i].correct ? COLORS.green : COLORS.red;
      else if (i === state.index) bg = COLORS.ochre;
      tilesHtml += `<div class="tile" style="background:${bg}"></div>`;
    });

    const promptWord = current.direction === 'es-en' ? current.es : current.en;
    const answerWord = current.direction === 'es-en' ? current.en : current.es;

    let bottomHtml;
    if (!state.checked) {
      bottomHtml = `
        <input id="answer-input" type="text" placeholder="Type the translation…" value="${esc(state.input)}" autocomplete="off" />
        <button id="check-btn" class="btn-primary">Check</button>
      `;
    } else {
      bottomHtml = `
        <div class="feedback ${state.wasCorrect ? 'correct' : 'wrong'}">
          <div class="title">${state.wasCorrect ? 'Correct' : 'Not quite'}</div>
          ${!state.wasCorrect ? `<div class="answer">Correct answer: <strong>${esc(answerWord)}</strong></div>` : ''}
        </div>
        <button id="next-btn" class="btn-primary">${state.index + 1 >= state.questions.length ? 'See results' : 'Next word'}</button>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="tiles">${tilesHtml}</div>
          <div class="progress-label">${state.index + 1} / ${state.questions.length} · ${current.direction === 'es-en' ? 'ES → EN' : 'EN → ES'}</div>
          <div class="prompt-card"><div class="prompt-word">${esc(promptWord)}</div></div>
          ${bottomHtml}
        </div>
      </div>
    `;

    if (!state.checked) {
      const input = document.getElementById('answer-input');
      input.focus();
      input.addEventListener('input', (e) => { state.input = e.target.value; });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAnswer(); });
      document.getElementById('check-btn').addEventListener('click', submitAnswer);
    } else {
      document.getElementById('next-btn').addEventListener('click', nextQuestion);
      document.addEventListener('keydown', function onEnter(e) {
        if (e.key === 'Enter') { nextQuestion(); document.removeEventListener('keydown', onEnter); }
      });
    }
  }

  function renderResult() {
    const app = document.getElementById('app');
    const score = state.results.filter(r => r.correct).length;
    const missed = state.results.filter(r => !r.correct);

    let mosaicHtml = '';
    state.results.forEach(r => {
      mosaicHtml += `<div class="sq" style="background:${r.correct ? COLORS.green : COLORS.red}"></div>`;
    });

    let reviewHtml = '';
    if (missed.length > 0) {
      let itemsHtml = '';
      missed.forEach(r => {
        itemsHtml += `
          <div class="review-item">
            <span class="from">${esc(r.prompt)}</span> → <span class="to">${esc(r.correctAnswer)}</span>
            ${r.userAnswer ? `<div class="yours">You wrote: ${esc(r.userAnswer)}</div>` : ''}
          </div>
        `;
      });
      reviewHtml = `
        <div class="card" style="margin-bottom:20px;">
          <div class="review-title">Words to review</div>
          ${itemsHtml}
        </div>
      `;
    }

    app.innerHTML = `
      <div class="screen">
        <div class="wrap">
          <div class="eyebrow">Resultado</div>
          <div class="score-big" style="margin-bottom:24px;">${score}/${state.questions.length}</div>
          <div class="mosaic">${mosaicHtml}</div>
          ${reviewHtml}
          <div class="btn-row">
            <button id="again-btn" class="btn-primary" style="flex:1;">Play again</button>
            <button id="new-btn" class="btn-secondary">New list</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('again-btn').addEventListener('click', startQuiz);
    document.getElementById('new-btn').addEventListener('click', playAgainFromScratch);
  }

  function render() {
    if (state.screen === 'start') renderStart();
    else if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'result') renderResult();
  }

  loadFromRepo();
</script>
</body>
</html>
